# Server Configuration
server.port=8080

# Database Configuration (Supabase PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://db.utdvsjyzybvwhudovgyn.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1OEt7ZLANvR6ZK9n}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console (Disabled for PostgreSQL)
spring.h2.console.enabled=false

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.serialization.fail-on-empty-beans=false
# HikariCP Connection Pool Settings (Optimized for Supabase PostgreSQL)
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=30000

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:80

# Gemini API Key Configuration
gemini.api.key=${GEMINI_API_KEY:}


