spring.application.name=knowledge-gap-platform

# PostgreSQL Database Configuration
# In production on Render, DB_URL, DB_USERNAME, and DB_PASSWORD are provided via environment variables.
# If not provided, it falls back to your local development database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knowledge_gap}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Port configuration (Render assigns a dynamic port via $PORT)
server.port=${PORT:8080}

huggingface.api.token=${HUGGINGFACE_API_TOKEN:}
huggingface.model=meta-llama/Llama-3.1-8B-Instruct