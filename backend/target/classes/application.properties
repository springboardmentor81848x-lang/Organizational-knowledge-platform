## MySQL (default for this project)
spring.datasource.url=jdbc:mysql://localhost:3306/silms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=silms
spring.datasource.password=change_me
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Let Flyway manage schema migrations; do not let Hibernate auto-create schema in production
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled when using MySQL)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

server.port=8080

app.auth.jwt-secret=knowledge-platform-demo-secret-key-knowledge-platform-demo-secret-key
app.course.api-key=knowledge-platform-course-api-key

# Flyway (will run migrations from classpath:db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
