server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for the text assets. The JS bundle is ~690 kB raw and ~197 kB gzipped, so this
    # is the difference between a fast first load and a slow one.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── The API ─────────────────────────────────────────────────────────────────
    # Proxied on the same origin as the app, which is what keeps the browser from treating
    # these as cross-origin requests at all.
    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Report generation runs live queries and renders a document, so it is slower than an
        # ordinary read. The default 60s would cut off a large organisation-wide report.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Downloads are streamed straight through rather than buffered to disk first, so a
        # report starts arriving while it is still being written.
        proxy_buffering off;
    }

    # ── Health ──────────────────────────────────────────────────────────────────
    # Proxied explicitly, because the SPA fallback at the bottom of this file would otherwise
    # swallow it: an unproxied /actuator/health falls through to try_files and returns index.html
    # with a 200. An uptime monitor pointed here would then report the platform healthy forever,
    # including while the API was completely dead — a false green is worse than no check at all.
    #
    # SecurityConfig permits this endpoint without a token precisely so a monitor can reach it,
    # and application.yml keeps it to a bare up/down with no component breakdown.
    location = /actuator/health {
        proxy_pass http://api:8081/actuator/health;
        proxy_set_header Host $host;

        # A health check should fail fast rather than hang: a monitor waiting 60s for an answer
        # is a monitor that has already told you what you needed to know.
        proxy_connect_timeout 5s;
        proxy_read_timeout    5s;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────────
    # The backend registers a STOMP endpoint at /ws (see WebSocketConfig). No frontend code
    # connects to it yet, so this block is not currently load-bearing — it is here so that when
    # something does, it works. A websocket proxied without the upgrade headers below fails its
    # handshake and simply goes quiet, which is a thoroughly unpleasant thing to debug later.
    location /ws {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # A websocket is idle between messages by design; the default read timeout would close
        # it during any quiet period.
        proxy_read_timeout 3600s;
    }

    # ── Static assets ───────────────────────────────────────────────────────────
    # Vite fingerprints these filenames, so a changed file is a changed URL and a long cache is
    # safe. index.html is deliberately not included: it is what points at the fingerprints, and
    # a cached one would keep serving the previous build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── The SPA ─────────────────────────────────────────────────────────────────
    # Client-side routing means /reports and /workforce are not files on disk. Without this
    # fallback they 404 on a refresh or on a pasted link, while working perfectly when reached
    # by clicking — which makes it look like a routing bug rather than a serving one.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
